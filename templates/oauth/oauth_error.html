{% extends 'share_layout/base.html' %}
{% block header %}
    <title>第三方授权失败</title>
{% endblock %}
{% block content %}
    <div class="mx-auto max-w-6xl px-4 py-6 lg:px-6 lg:py-10">
        <div class="mx-auto max-w-xl rounded-xl border border-border bg-card p-8 shadow-sm">
            <h2 class="text-xl font-bold tracking-tight text-foreground mb-2">{{ type_name }}授权失败</h2>
            <p class="text-sm text-muted-foreground">{{ message }}</p>
            <div class="mt-6 flex items-center gap-3">
                <a href="/"
                   class="rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition-colors hover:bg-muted">
                    返回首页
                </a>
                {% if oauth_type %}
                    <a href="{% url 'oauth:oauthlogin' %}?type={{ oauth_type }}"
                       class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90">
                        重新授权
                    </a>
                {% else %}
                    <a href="{% url 'accounts:login' %}"
                       class="rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90">
                        返回登录页
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
{% endblock %}
